name: Publish the redirect

# The Rin site itself lives at petermei.com/rin, served out of the petermei
# repo. What GitHub Pages publishes from here is redirect/, so every link ever
# shared to exata531.github.io/Rin still lands on the real page instead of on a
# second copy that can drift.
#
# Pages cannot exist while the repo is private (free plan), so the job skips
# itself until the repo flips public — a skipped run, not a red X on every
# push. Once public it still needs Pages switched on once: Settings, Pages,
# Source: GitHub Actions.
#
# site/ is still the source of the real page; it is copied into the petermei
# repo under public/rin. The modules page is generated from
# modules/registry.json and the generated file is committed, so this job
# rebuilds it and refuses to run if what is committed is not what the
# generator produces. That check is what keeps this repo and petermei.com/rin
# from quietly disagreeing. It does NOT commit the fix itself: a push made
# with the default token fires no further workflows, so a chain that commits
# and expects a redeploy would silently never deploy at all.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'redirect/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the module index and page
        run: |
          python3 scripts/check-modules.py
          python3 scripts/build-modules.py
      - name: Fail if the committed page is stale
        run: |
          if ! git diff --quiet -- modules/index.json site/modules.html; then
            echo "::error::modules/index.json or site/modules.html is out of date."
            echo "Run: python3 scripts/check-modules.py && python3 scripts/build-modules.py"
            git --no-pager diff --stat -- modules/index.json site/modules.html
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deploy
        uses: actions/deploy-pages@v4
